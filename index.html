<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fornalha Pizzaria</title>
  <meta name="description" content="Cardápio digital da Fornalha Pizzaria: monte sua pizza fatia por fatia e envie o pedido pelo WhatsApp.">
  <meta name="theme-color" content="#B8231C">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Yellowtail&family=Herr+Von+Muellerhoff&family=Figtree:wght@400..800&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="app">
  <a class="skip-link" href="#menu">Pular para o cardápio</a>

  <!-- Aviso de conexão -->
  <div class="net-banner" id="netBanner" role="alert" hidden></div>

  <!-- Header -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#top" aria-label="Fornalha Pizzaria — início">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#B8231C"/><circle cx="20" cy="20" r="16.5" fill="none" stroke="#F4E1C4" stroke-width="1.2" stroke-dasharray="2 2.2"/><text x="20" y="28.2" text-anchor="middle" font-family="Anton, Impact, 'Arial Narrow', sans-serif" font-size="22" fill="#F4E1C4">F</text></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name script">Fornalha</span>
          <span class="store-status" id="storeStatus"></span>
        </span>
      </a>
      <div class="topbar-hours" id="topbarHours"></div>
      <button class="cart-btn" id="cartBtn" type="button" data-act="open-cart" aria-label="Abrir carrinho">
        <svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4ZM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="cart-btn-label">Carrinho</span>
        <span class="cart-count" id="cartCount" aria-live="polite">0</span>
      </button>
    </div>
  </header>

  <div class="layout" id="top">
    <main class="menu" id="menu" tabindex="-1">
      <div id="menuHero"></div>
      <nav class="cats" id="cats" aria-label="Categorias do cardápio"></nav>
      <div id="menuBody" aria-live="polite"></div>
      <footer class="site-footer" id="siteFooter"></footer>
    </main>
    <aside class="cart-side" id="cartSide" aria-label="Seu pedido"></aside>
  </div>

  <!-- Barra de carrinho (mobile/tablet) -->
  <div class="cart-bar" id="cartBar" hidden></div>

  <!-- Montagem da pizza -->
  <div class="overlay builder-overlay" id="builder" hidden aria-hidden="true">
    <div class="backdrop" data-close-builder></div>
    <section class="builder" role="dialog" aria-modal="true" aria-labelledby="builderTitle"></section>
  </div>

  <!-- Escolha do sabor -->
  <div class="overlay picker-overlay" id="picker" hidden aria-hidden="true">
    <div class="backdrop" data-close></div>
    <section class="sheet picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle"></section>
  </div>

  <!-- Carrinho -->
  <div class="overlay" id="cartDrawer" hidden aria-hidden="true">
    <div class="backdrop" data-close></div>
    <section class="drawer cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cartTitle"></section>
  </div>

  <!-- Checkout -->
  <div class="overlay checkout-overlay" id="checkout" hidden aria-hidden="true">
    <section class="checkout" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle"></section>
  </div>

  <!-- Política, termos e LGPD -->
  <div class="overlay" id="legal" hidden aria-hidden="true">
    <div class="backdrop" data-close></div>
    <section class="sheet legal-sheet" role="dialog" aria-modal="true" aria-labelledby="legalTitle"></section>
  </div>

  <!-- Painel de estados do protótipo -->
  <div class="overlay" id="demo" hidden aria-hidden="true">
    <div class="backdrop" data-close></div>
    <section class="sheet demo-sheet" role="dialog" aria-modal="true" aria-labelledby="demoTitle"></section>
  </div>
  <button class="demo-fab" type="button" data-act="open-demo" aria-label="Estados do protótipo">
    <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
    <span>Estados</span>
  </button>

  <!-- Consentimento (LGPD) -->
  <div class="consent" id="consent" hidden></div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/pizza.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/vendor/supabase.js"></script>
  <script src="assets/js/backend.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
